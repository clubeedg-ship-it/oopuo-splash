<!doctype html><html><head><meta charset="utf-8"><style>
  @import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap');
  *{margin:0;box-sizing:border-box}
  html,body{width:1200px;height:630px}
  body{background:#070709;overflow:hidden;font-family:'Instrument Sans',system-ui,sans-serif;position:relative}
  .glow{position:absolute;width:920px;height:920px;left:520px;top:-280px;border-radius:50%;
    background:radial-gradient(circle,rgba(34,211,238,.22),rgba(34,211,238,.05) 45%,transparent 64%);filter:blur(12px)}
  .grid{position:absolute;inset:0;opacity:.06;
    background-image:linear-gradient(#67E8F9 1px,transparent 1px),linear-gradient(90deg,#67E8F9 1px,transparent 1px);
    background-size:46px 46px;-webkit-mask-image:radial-gradient(circle at 78% 30%,#000,transparent 60%)}
  .frame{position:absolute;inset:54px;border:1px solid rgba(255,255,255,.10);border-radius:18px}
  .pad{position:absolute;inset:0;padding:104px 100px;display:flex;flex-direction:column;justify-content:space-between}
  .mark{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:20px;letter-spacing:.42em;
    color:#67E8F9;text-transform:uppercase}
  h1{font-size:78px;line-height:1.04;font-weight:700;color:#EAEDF3;max-width:880px;letter-spacing:-.018em}
  h1 b{color:#22D3EE;font-weight:700}
  .foot{display:flex;justify-content:space-between;align-items:flex-end}
  .tag{font-size:25px;color:#9AA0B4;font-weight:400;max-width:760px}
  .dot{font-family:'JetBrains Mono',monospace;font-size:16px;color:#5b6072;letter-spacing:.24em}
</style></head><body>
  <div class="glow"></div><div class="grid"></div><div class="frame"></div>
  <div class="pad">
    <div class="mark">OOPUO · Engineering Studio · Amsterdam</div>
    <h1>We build your <b>AI systems.</b><br>You focus on growing.</h1>
    <div class="foot"><div class="tag">AI websites · automation · customer support — for European businesses</div><div class="dot">oopuo.com</div></div>
  </div>
</body></html>
